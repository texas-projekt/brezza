name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The native shell targets .NET Framework 4.8, so it builds only on Windows.
      - run: dotnet restore Brezza.slnx --locked-mode

      - run: dotnet build Brezza.slnx -c Release --no-restore

      - run: dotnet test tests/Brezza.Core.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/**
          retention-days: 14
