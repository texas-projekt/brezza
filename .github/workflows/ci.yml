name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The native shell targets .NET Framework 4.8, so it builds only on Windows.
      - run: dotnet restore Brezza.slnx

      - run: dotnet build Brezza.slnx -c Release --no-restore

      # The same entry point developers run locally; CI runs the stage its runners can.
      - run: pwsh tools/test.ps1 -Stage Unit -Configuration Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          retention-days: 14
