name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v0.1.9'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run releases the tag given as input, not the branch it ran on.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore Brezza.slnx --locked-mode

      - run: dotnet build Brezza.slnx -c Release --no-restore

      # Nothing ships from a broken build. The same entry point developers run locally; CI runs
      # the stage its runners can.
      - run: pwsh tools/test.ps1 -Stage Unit -Configuration Release

      # A tag is v<semver>[-prerelease]; the leading v is dropped and any suffix marks the
      # release as a pre-release, so v0.2.0-beta.1 and nightly tags are not shown as latest.
      - id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' is not semver (expected vX.Y.Z or vX.Y.Z-prerelease)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($tag -match '-') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      # The merge runs here; the packaged executable is what ships (ADR 0009). The launch check is
      # skipped because a CI runner has no interactive desktop or WebView2 runtime. The version and
      # the skip reach the packager through the same entry point developers run locally.
      - run: >-
          pwsh tools/test.ps1 -Stage Package
          -PackageVersion "${{ steps.version.outputs.version }}"
          -SkipLaunchVerification

      - uses: actions/upload-artifact@v7
        with:
          name: brezza-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 30

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          files: |
            dist/*.zip
            dist/*.zip.sha256
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
