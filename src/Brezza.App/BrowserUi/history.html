<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="internal.css">
</head>
<body class="internal-page" data-page="history">
    <div class="page">
        <nav class="page-nav" data-i18n-aria-label="internal.nav">
            <button class="nav-item" type="button" data-open="openSettings" data-i18n="settings.title"></button>
            <button class="nav-item" type="button" data-open="openHistory" aria-current="page" data-i18n="history.title"></button>
            <button class="nav-item" type="button" data-open="openBookmarks" data-i18n="bookmarks.title"></button>
        </nav>
        <main class="page-main">
            <header class="page-header">
                <div>
                    <h1 data-i18n="history.title"></h1>
                    <p class="page-subtitle" data-i18n="history.subtitle"></p>
                </div>
                <button id="close-page" class="button" type="button" data-close-page data-i18n="history.close"></button>
            </header>
            <div class="list-toolbar">
                <input id="list-filter" class="filter" type="search" spellcheck="false" data-i18n-placeholder="history.search" data-i18n-aria-label="history.search">
                <span id="list-count" class="list-count" aria-live="polite"></span>
            </div>
            <ul id="history-list" class="item-list" data-i18n-aria-label="history.title" data-empty="history.empty"></ul>
        </main>
    </div>
    <script src="internal.js"></script>
</body>
</html>
