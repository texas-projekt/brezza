<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brezza</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="i-back" viewBox="0 0 20 20"><path d="M16 10H4m5-5-5 5 5 5"/></symbol>
        <symbol id="i-forward" viewBox="0 0 20 20"><path d="M4 10h12m-5-5 5 5-5 5"/></symbol>
        <symbol id="i-reload" viewBox="0 0 20 20"><path d="M15.5 10a5.5 5.5 0 1 1-1.6-3.9M15.5 3.5v3.2h-3.2"/></symbol>
        <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></symbol>
        <symbol id="i-close" viewBox="0 0 20 20"><path d="m6 6 8 8m0-8-8 8"/></symbol>
        <symbol id="i-private" viewBox="0 0 20 20"><path d="M3 9.5h14M5 9.5l1.3-4.2a1 1 0 0 1 1.2-.7l2.5.7 2.5-.7a1 1 0 0 1 1.2.7L15 9.5"/><circle cx="6.5" cy="13.5" r="2.2"/><circle cx="13.5" cy="13.5" r="2.2"/><path d="M8.7 13.2c.8-.5 1.8-.5 2.6 0"/></symbol>
        <symbol id="i-star" viewBox="0 0 20 20"><path d="m10 3.2 2 4.2 4.6.6-3.4 3.2.9 4.5L10 13.5l-4.1 2.2.9-4.5L3.4 8l4.6-.6z"/></symbol>
        <symbol id="i-bookmarks" viewBox="0 0 20 20"><path d="M6 3.5h8a1 1 0 0 1 1 1v12l-5-3.2-5 3.2v-12a1 1 0 0 1 1-1z"/></symbol>
        <symbol id="i-history" viewBox="0 0 20 20"><path d="M3.6 10A6.4 6.4 0 1 0 5.5 5.5M3.5 3.5v3h3"/><path d="M10 6.5V10l2.5 1.6"/></symbol>
        <symbol id="i-settings" viewBox="0 0 20 20"><path d="M15.14 8.72 16.93 9v2l-1.79.28-.6 1.45 1.06 1.47-1.4 1.4-1.47-1.06-1.45.6-.29 1.79H9.01l-.29-1.79-1.45-.6-1.47 1.06-1.4-1.4 1.06-1.47-.6-1.45L3.07 11V9l1.79-.28.6-1.45L4.4 5.8l1.4-1.4 1.47 1.06 1.45-.6.29-1.79h1.98l.29 1.79 1.45.6L14.2 4.4l1.4 1.4-1.06 1.47z"/><circle cx="10" cy="10" r="2.3"/></symbol>
        <symbol id="i-search" viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5"/><path d="m12.6 12.6 4 4"/></symbol>
        <symbol id="i-globe" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.8"/><path d="M3.2 10h13.6M10 3.2c-3.8 4.2-3.8 9.4 0 13.6m0-13.6c3.8 4.2 3.8 9.4 0 13.6"/></symbol>
        <symbol id="i-lock" viewBox="0 0 20 20"><rect x="5" y="8.8" width="10" height="7.7" rx="1.6"/><path d="M7.2 8.8V6.6a2.8 2.8 0 0 1 5.6 0v2.2"/></symbol>
        <symbol id="i-warning" viewBox="0 0 20 20"><path d="M10 3.4 17 16H3z"/><path d="M10 8v3.6m0 2.2v.1"/></symbol>
        <symbol id="i-file" viewBox="0 0 20 20"><path d="M6 3h5.5L15 6.5V17H6z"/><path d="M11.5 3v3.5H15"/></symbol>
        <symbol id="i-tab" viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="11" rx="1.5"/><path d="M3 8.5h7V5"/></symbol>
        <symbol id="i-brezza" viewBox="0 0 20 20"><path d="M4 12.5c2.5-1.6 5.4-1.6 8 0s5.1 1.6 4 0M4 8.5c2.5-1.6 5.4-1.6 8 0s4.6 1.4 4 .2"/></symbol>
        <symbol id="i-enter" viewBox="0 0 20 20"><path d="M15.5 5v4.5a2 2 0 0 1-2 2h-9m3-3-3 3 3 3"/></symbol>
    </svg>

    <div id="chrome" class="chrome">
        <header id="chrome-bar" class="chrome-bar">
            <div class="tabstrip">
                <div id="tabs" class="tabs" role="tablist" data-i18n-aria-label="tab.list"></div>
                <button id="NewTabButton" class="icon-button new-tab" type="button" data-i18n-aria-label="tab.newAction" data-i18n-title="tab.newActionShortcut">
                    <svg class="icon"><use href="#i-plus"/></svg>
                </button>
                <div class="tabstrip-end">
                    <button id="NewPrivateTabButton" class="icon-button" type="button" data-i18n-aria-label="tab.newPrivateAction" data-i18n-title="tab.newPrivateActionShortcut">
                        <svg class="icon"><use href="#i-private"/></svg>
                    </button>
                </div>
            </div>

            <div class="toolbar" role="toolbar" data-i18n-aria-label="toolbar.controls">
                <div class="toolbar-group">
                    <button id="back" class="icon-button" type="button" data-i18n-aria-label="toolbar.back" data-i18n-title="toolbar.backShortcut" disabled>
                        <svg class="icon"><use href="#i-back"/></svg>
                    </button>
                    <button id="forward" class="icon-button" type="button" data-i18n-aria-label="toolbar.forward" data-i18n-title="toolbar.forwardShortcut" disabled>
                        <svg class="icon"><use href="#i-forward"/></svg>
                    </button>
                    <button id="reload" class="icon-button" type="button" data-i18n-aria-label="toolbar.reload" data-i18n-title="toolbar.reloadShortcut">
                        <svg class="icon"><use href="#i-reload"/></svg>
                    </button>
                </div>

                <form id="address-form" class="omnibox" role="search" autocomplete="off">
                    <span id="site-indicator" class="site-indicator" role="img">
                        <svg class="icon"><use id="site-indicator-icon" href="#i-search"/></svg>
                    </span>
                    <div class="omnibox-field">
                        <input id="OmniBox" name="address" type="text" spellcheck="false"
                               data-i18n-placeholder="address.placeholder" data-i18n-aria-label="address.label">
                        <div id="omnibox-display" class="omnibox-display" aria-hidden="true"></div>
                    </div>
                    <button id="bookmark" class="icon-button omnibox-action" type="button" aria-pressed="false" data-i18n-aria-label="toolbar.bookmark" data-i18n-title="toolbar.bookmark">
                        <svg class="icon"><use href="#i-star"/></svg>
                    </button>
                </form>

                <div class="toolbar-group">
                    <button id="bookmarks" class="icon-button" type="button" data-i18n-aria-label="toolbar.bookmarks" data-i18n-title="toolbar.bookmarks">
                        <svg class="icon"><use href="#i-bookmarks"/></svg>
                    </button>
                    <button id="history" class="icon-button" type="button" data-i18n-aria-label="toolbar.history" data-i18n-title="toolbar.history">
                        <svg class="icon"><use href="#i-history"/></svg>
                    </button>
                    <button id="settings" class="icon-button" type="button" data-i18n-aria-label="toolbar.settings" data-i18n-title="toolbar.settings">
                        <svg class="icon"><use href="#i-settings"/></svg>
                    </button>
                </div>
            </div>

            <div id="notice" class="notice" role="status" aria-live="polite" hidden>
                <svg class="icon notice-icon" aria-hidden="true"><use href="#i-warning"/></svg>
                <span id="notice-text" class="notice-text"></span>
                <button id="notice-action" class="text-button" type="button" hidden></button>
                <button id="notice-dismiss" class="icon-button small" type="button" data-i18n-aria-label="notice.dismiss" data-i18n-title="notice.dismiss">
                    <svg class="icon"><use href="#i-close"/></svg>
                </button>
            </div>
        </header>

    </div>
    <script src="app.js"></script>
</body>
</html>
